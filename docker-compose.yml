version: '3.8'

services:
  # 1. RabbitMQ (Async Job Queue & Management UI)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - rag-network
    restart: unless-stopped
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq/
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Milvus Dependencies (Etcd Metadata Coordination & MinIO Object Storage)
  etcd:
    image: quay.io/coreos/etcd:v3.5.0
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - rag-network
    volumes:
      - etcd-data:/etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: minio server /minio_data --console-address ":9001"
    networks:
      - rag-network
    volumes:
      - minio-data:/minio_data

  # 3. Milvus Standalone (Dense Vector Database)
  milvus:
    image: milvusdb/milvus:v2.3.0
    container_name: milvus-standalone
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      - etcd
      - minio
    ports:
      - "19530:19530"
    networks:
      - rag-network

  # 4. Ollama (Local LLM Server)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - rag-network

  # 5. FastAPI Staff RAG Backend (Hybrid Retrieval + Cross-Encoder + LangGraph CRAG/Self-RAG)
  fastapi-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi-backend
    ports:
      - "8000:8000"
    networks:
      - rag-network
    environment:
      - RABBITMQ_HOST=rabbitmq
      - MILVUS_HOST=milvus-standalone
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=llama3.1
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - RERANKER_MODEL=cross-encoder/ms-marco-MiniLM-L-6-v2
      - RELEVANCE_THRESHOLD=0.25
      - RRF_K=60
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      milvus:
        condition: service_started
      ollama:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend:/app

  # 6. Gradio Observability & Evaluation Studio
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "7860:7860"
    networks:
      - rag-network
    environment:
      - BACKEND_URL=http://fastapi-backend:8000
    depends_on:
      - fastapi-backend
    restart: unless-stopped
    volumes:
      - ./frontend:/app

  # 7. Attu (Milvus Vector DB Admin UI)
  attu:
    image: zilliz/attu:v2.3.0
    container_name: attu
    environment:
      MILVUS_URL: milvus-standalone:19530
    ports:
      - "9090:3000"
    depends_on:
      - milvus
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  rabbitmq-data:
  milvus-data:
  etcd-data:
  minio-data:
  ollama-data:
